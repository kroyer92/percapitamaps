<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Per Capita Maps Studio</title>
<style>
@font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 700; font-display: swap; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 800; font-display: swap; src: url(fonts/inter-latin-800-normal.woff2) format('woff2'); }

:root {
  --navy: #0f2a3d; --navy-2: #163a54; --navy-3: #1d4561; --pale: #d9ecf7; --blue: #6fb3e0; --amber: #f0b04a;
  --muted: #8fb3cc; --ink: #0f2a3d; --ink-2: #4d6577; --paper: #fbfcfd; --line: #e3eaef;
  --wall-1: #e6eef3; --wall-2: #d6e2ea; --trim: #b9c9d4; --wood-1: #b88c63; --wood-2: #ad8159;
  --desk: #5b3d26; --desk-2: #3f2a1a; --good: #2e7d4f; --bad: #b4482f; --warn: #c98a1c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--wood-1); }
body { font-family: Inter, system-ui, sans-serif; color: var(--ink); min-height: 100vh; background: var(--wall-1); overflow-x: hidden; }
b, strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- the room ---------- */
.wall { background: linear-gradient(var(--wall-1), var(--wall-2)); padding: 20px 32px 34px; position: relative; }
.wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: var(--trim); }
.floor { background: repeating-linear-gradient(90deg, var(--wood-1) 0 158px, var(--wood-2) 158px 160px); position: relative; padding: 18px 32px 40px; }
.floor::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,0) 120px); pointer-events: none; }
.inner { max-width: 1560px; margin: 0 auto; position: relative; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.sign { background: var(--navy); color: var(--pale); padding: 9px 18px; border-radius: 6px; font-weight: 800; font-size: 22px; box-shadow: 0 3px 0 #08192a; }
.sign small { display: block; font-weight: 600; font-size: 11px; color: var(--blue); letter-spacing: .14em; text-transform: uppercase; }
.live { display: inline-flex; align-items: center; gap: 8px; background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 6px rgba(15,42,61,.12); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: #9aa9b3; }
.live.on i { background: #2fb36b; animation: pulse 1.6s infinite; }
.live.off i { background: var(--bad); }
.demo-tag { background: var(--amber); color: var(--navy); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 99px; }
.spacer { flex: 1; }
.clock { background: var(--navy); border-radius: 10px; color: var(--pale); text-align: center; padding: 8px 16px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; min-width: 180px; }
.clock b { display: block; font-size: 22px; letter-spacing: 0; color: var(--amber); font-weight: 800; }
.clock span { display: block; font-size: 11px; letter-spacing: .02em; text-transform: none; color: var(--muted); font-weight: 500; margin-top: 2px; }
.clock.local b { color: var(--pale); }

/* ---------- wall: TV + whiteboard ---------- */
.wallgrid { display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); gap: 36px; align-items: start; }
.label { display: block; width: max-content; margin: 12px auto 0; background: #3c5566; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 4px 12px; border-radius: 99px; }
.h { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.tv { background: #111; border-radius: 14px; padding: 14px; box-shadow: 0 10px 24px rgba(15,42,61,.35); }
.screen { background: var(--navy); border-radius: 6px; color: var(--pale); padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; min-height: 360px; }
.screen .h { color: var(--blue); }
.meter .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600; margin-bottom: 7px; }
.meter .row .muted { color: var(--muted); font-weight: 400; }
.bar { height: 20px; background: var(--navy-3); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 20px; background: linear-gradient(90deg, var(--blue), var(--amber)); border-radius: 99px; transition: width 1.2s ease; }
.meter.alt { opacity: .62; }
.meter.alt .bar { height: 10px; }
.or { font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin: -6px 0 -8px; }
.est { margin-top: auto; background: var(--navy-2); border-radius: 8px; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
.est b { color: var(--amber); }
.src { font-size: 12px; color: var(--muted); }

.board { background: var(--paper); border: 10px solid #c5d0d8; border-radius: 8px; padding: 18px 20px 16px; box-shadow: 0 10px 24px rgba(15,42,61,.2); min-height: 388px; display: flex; flex-direction: column; }
.board .h { margin-bottom: 12px; }
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.note { background: #fff3c9; padding: 10px 12px; border-radius: 3px; box-shadow: 0 3px 6px rgba(0,0,0,.12); font-size: 13px; line-height: 1.35; animation: settle .5s ease both; }
.note:nth-child(6n+2) { background: #dff0fb; transform: rotate(.8deg); }
.note:nth-child(6n+3) { background: #e3f4e6; transform: rotate(-.8deg); }
.note:nth-child(6n+4) { background: #fde3d8; }
.note:nth-child(6n+5) { background: #efe6fb; transform: rotate(.6deg); }
.note:nth-child(6n) { background: #fff3c9; transform: rotate(-.5deg); }
.note b { display: block; font-size: 14px; margin-bottom: 3px; }
.note .meta { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
.note .meta.hot { color: #a5570a; }
.note .why b { display: inline; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 14px; }
.chip { background: #eef3f6; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.chip.hot { background: #fde9c4; }
.empty { color: var(--ink-2); font-size: 14px; line-height: 1.5; padding: 8px 0; }

/* ---------- the crew ---------- */
.crew-h { display: flex; align-items: baseline; gap: 12px; color: #fff; margin: 0 0 10px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.crew-h .h { color: #fff; }
.crew-h .q { font-size: 13px; opacity: .9; }
.crew { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 14px; }
.st { position: relative; display: flex; }
.bubble { position: relative; width: 100%; height: 100%; min-height: 84px; background: #fff; border-radius: 10px; padding: 8px 10px 9px; font-size: 12.5px; line-height: 1.35; box-shadow: 0 4px 10px rgba(0,0,0,.18); transition: background .3s; }
.bubble .who { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; margin-bottom: 3px; }
.bubble .who i { width: 8px; height: 8px; border-radius: 50%; background: #9aa9b3; flex: none; }
.bubble .who em { margin-left: auto; font-style: normal; font-weight: 600; font-size: 11px; color: var(--ink-2); }
.bubble .txt { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bubble .sub { margin-top: 5px; font-size: 11px; color: var(--ink-2); font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; }
.bubble .pbar { height: 5px; background: #e6edf2; border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bubble .pbar i { display: block; height: 100%; background: var(--blue); transition: width .8s linear; }
.st[data-state=idle] .bubble { background: rgba(255,255,255,.72); }
.st[data-state=idle] .bubble .txt { color: var(--ink-2); }
.st[data-state=working] .bubble .who i { background: #2fb36b; animation: pulse 1.2s infinite; }
.st[data-state=waiting] .bubble { background: #fde9c4; }
.st[data-state=waiting] .bubble .who i { background: var(--amber); animation: pulse 1.2s infinite; }
.st[data-state=done] .bubble .who i { background: var(--good); }
.st[data-state=failed] .bubble { background: #fbe1da; }
.st[data-state=failed] .bubble .who i { background: var(--bad); }
/* ---------- the office floor (office/office.js) ---------- */
.office { margin: 0 auto 16px; max-width: 1320px; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.28); background: #2a1d14; }
.office-scroll { overflow-x: auto; }
.office svg { display: block; width: 100%; min-width: 820px; height: auto; user-select: none; }
.office .robot { cursor: pointer; outline: none; }
.st { cursor: pointer; }
.st:focus-visible .bubble { outline: 3px solid var(--amber); outline-offset: 2px; }
.st.sel .bubble { box-shadow: 0 0 0 3px var(--amber), 0 4px 10px rgba(0,0,0,.18); }

@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(47,179,107,.55); } 50% { box-shadow: 0 0 0 5px rgba(47,179,107,0); } }
@keyframes settle { from { opacity: 0; transform: translateY(-6px) rotate(-2deg); } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(240,176,74,.9); } 100% { box-shadow: 0 0 0 12px rgba(240,176,74,0); } }
.flash { animation: flash .9s ease-out; }

/* ---------- monitors ---------- */
.mons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 34px; }
.mon-wrap { display: flex; flex-direction: column; align-items: center; }
.mon-wrap .mon { flex: 1; display: flex; }
.mon-wrap .scr { flex: 1; }
.mon { width: 100%; background: #1a1a1a; border-radius: 10px; padding: 10px; box-shadow: 0 8px 18px rgba(0,0,0,.25); }
.scr { background: #fff; border-radius: 4px; padding: 14px 16px; font-size: 13px; min-height: 250px; }
.scr .h { color: #1b5e8c; margin-bottom: 10px; }
.stand { width: 60px; height: 30px; background: #2a2a2a; clip-path: polygon(35% 0, 65% 0, 80% 100%, 20% 100%); }
.tabletop { width: 108%; height: 22px; background: var(--desk); border-radius: 4px; box-shadow: 0 6px 0 var(--desk-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; color: #56646e; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.n { font-weight: 600; }
td.t { max-width: 0; width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.t a { color: inherit; text-decoration: none; }
td.t a:hover { text-decoration: underline; }
.up { color: var(--good); } .dn { color: var(--bad); } .mid { color: var(--warn); }
.vd { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: #eef3f6; color: var(--ink-2); white-space: nowrap; }
.vd.winner { background: #fde9c4; color: #8a4b00; } .vd.loser { background: #fbe1da; color: var(--bad); } .vd.average { background: #e3f4e6; color: var(--good); }
.lock { display: flex; align-items: center; gap: 12px; background: #f4f7f9; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-weight: 600; line-height: 1.35; }
.lock svg { flex: none; }
.ghost .hb .t i { background: #c6dced; }
.ghost { opacity: .55; }
.hb { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.hb .lab { width: 34%; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .t { flex: 1; height: 15px; background: #eef3f6; border-radius: 4px; overflow: hidden; }
.hb .t i { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width 1s ease; }
.hb .t i.win { background: var(--amber); }
.hb .v { width: 64px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.hb .v small { font-weight: 500; color: var(--ink-2); }
.lab-h { font-weight: 700; margin: 10px 0 2px; font-size: 13px; }
.lab-h:first-of-type { margin-top: 0; }
.note-s { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.45; }

/* ---------- radio (activity log) ---------- */
.radio { margin-top: 34px; background: rgba(15,42,61,.92); color: var(--pale); border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 18px rgba(0,0,0,.25); }
.radio .h { color: var(--blue); margin-bottom: 8px; }
.radio ol { list-style: none; max-height: 220px; overflow: auto; }
.radio li { display: grid; grid-template-columns: 56px 92px 1fr; gap: 10px; padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(217,236,247,.08); animation: settle .4s ease both; }
.radio li time { color: var(--muted); font-variant-numeric: tabular-nums; }
.radio li .a { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.radio li .a i { width: 8px; height: 8px; border-radius: 50%; }
.radio li.failed { color: #f5b3a3; }
.radio li.done .x::before { content: "✓ "; color: #7fd6a3; }
.radio .empty { color: var(--muted); }

.err { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; display: none; z-index: 5; }

/* ---------- smaller screens ---------- */
@media (max-width: 1280px) {
  .crew { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 24px; }
}
@media (max-width: 1100px) {
  .wallgrid { grid-template-columns: 1fr; gap: 24px; }
  .mons { grid-template-columns: 1fr; gap: 24px; }
  .tabletop { display: none; }
}
@media (max-width: 720px) {
  .wall, .floor { padding-left: 16px; padding-right: 16px; }
  .crew { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; row-gap: 20px; }
  .notes { grid-template-columns: 1fr 1fr; }
  .screen { padding: 16px; min-height: 0; }
  .sign { font-size: 18px; }
  .clock { min-width: 0; flex: 1; }
  .clock b { font-size: 18px; }
  .radio li { grid-template-columns: 46px 1fr; }
  .radio li .x { grid-column: 1 / -1; }
}
@media (max-width: 420px) {
  .notes { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wall">
  <div class="inner">
    <div class="top">
      <div class="sign"><small id="domain">Studio</small><span id="chan">Per Capita Maps</span> Studio</div>
      <span class="live" id="live"><i></i><span>Connecting…</span></span>
      <span class="demo-tag" id="demoTag" hidden>Demo · example numbers</span>
      <span class="spacer"></span>
      <div class="clock local"><span style="margin:0 0 2px">Your time</span><b id="now">--:--</b></div>
      <div class="clock"><span style="margin:0 0 2px">Next upload</span><b id="next">–</b><span id="nextSub"></span></div>
    </div>

    <div class="wallgrid">
      <div>
        <div class="tv"><div class="screen" id="tv"><div class="h">Road to monetization (YouTube Partner Program)</div><div class="empty" style="color:var(--muted)">Loading…</div></div></div>
        <span class="label">Wall TV</span>
      </div>
      <div>
        <div class="board">
          <div class="h">Coming up · and why</div>
          <div class="notes" id="notes"></div>
          <div class="chips" id="chips"></div>
        </div>
        <span class="label">Whiteboard</span>
      </div>
    </div>
  </div>
</div>

<div class="floor">
  <div class="inner">
    <div class="crew-h"><span class="h">The office</span><span class="q" id="queue"></span></div>
    <div class="office"><div class="office-scroll"><svg id="office" role="img" aria-label="The office: one robot per agent, walking between desks as the pipeline works"></svg></div></div>
    <div class="crew" id="crew"></div>

    <div class="mons">
      <div class="mon-wrap"><div class="mon"><div class="scr" id="perf"></div></div><div class="stand"></div><div class="tabletop"></div></div>
      <div class="mon-wrap"><div class="mon"><div class="scr" id="earn"></div></div><div class="stand"></div><div class="tabletop"></div></div>
      <div class="mon-wrap"><div class="mon"><div class="scr" id="lab"></div></div><div class="stand"></div><div class="tabletop"></div></div>
    </div>

    <div class="radio">
      <div class="h">Office radio · what just happened</div>
      <ol id="log"></ol>
    </div>
  </div>
</div>
<div class="err" id="err"></div>

<script src="office/office.js"></script>
<script>
'use strict';
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n == null ? '–' : n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '')}M` : n >= 1e4 ? `${(n / 1e3).toFixed(1).replace(/\.0$/, '')}k` : Math.round(n).toLocaleString('en-US');
const pct = (x) => x == null ? '–' : `${Math.round(x)}%`;
let TZ = 'Europe/Copenhagen';

// ---------- the crew: one robot each in the office (office/office.js) ----------
const CREW = [
  { id: 'scout', role: 'Finds topics', color: '#4f98c6' },
  { id: 'writer', role: 'Writes the script', color: '#e0a03c' },
  { id: 'narrator', role: 'Records the voice', color: '#6f9f80' },
  { id: 'editor', role: 'Renders the video', color: '#c86b5a' },
  { id: 'checker', role: 'Quality checks', color: '#7d6bb5' },
  { id: 'publisher', role: 'Ships & cross-posts', color: '#2f78a6' },
  { id: 'analyst', role: 'Scores the numbers', color: '#4d6577' },
];
const NAMES = { scout: 'Scout', writer: 'Writer', narrator: 'Narrator', editor: 'Editor', checker: 'Checker', publisher: 'Publisher', analyst: 'Analyst' };
const COLOR = Object.fromEntries(CREW.map((c) => [c.id, c.color]));
let office;
let selected = 'editor';

const agents = {};
function buildCrew() {
  $('crew').innerHTML = CREW.map((c) => `
    <div class="st" id="st-${c.id}" data-state="idle" tabindex="0" role="button" aria-label="${NAMES[c.id]}: show in the office">
      <div class="bubble"><div class="who"><i></i>${NAMES[c.id]}<em></em></div><div class="txt">Free</div><div class="sub"></div></div>
    </div>`).join('');
  CREW.forEach((c) => {
    const st = $(`st-${c.id}`);
    st.addEventListener('click', () => select(c.id));
    st.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(c.id); } });
  });
  office = window.StudioOffice?.create($('office'), {
    crew: CREW.map((c) => ({ id: c.id, name: NAMES[c.id], role: c.role, color: c.color })),
    tz: () => TZ,
    onSelect: select,
  });
  select(selected);
}

// Clicking a robot or its card highlights both.
function select(id) {
  selected = id;
  CREW.forEach((c) => $(`st-${c.id}`)?.classList.toggle('sel', c.id === id));
  office?.select(id);
}

const since = (iso) => {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  return `${Math.floor(s / 86400)}d`;
};

function paintAgent(a) {
  agents[a.id] = a;
  const el = $(`st-${a.id}`);
  if (!el) return;
  if (el.dataset.state !== a.state) {
    el.dataset.state = a.state;
    el.querySelector('.bubble').classList.remove('flash');
    void el.offsetWidth;
    if (a.state !== 'idle') el.querySelector('.bubble').classList.add('flash');
  }
  el.querySelector('.txt').textContent = a.text || '';
  el.querySelector('.who em').textContent = a.job ? `#${a.job}` : '';
  office?.agent(a);
  tickAgent(a);
}

function tickAgent(a) {
  const el = $(`st-${a.id}`);
  if (!el) return;
  const parts = [];
  if (a.state === 'working') parts.push(`for ${since(a.since)}`);
  else if (a.state === 'waiting') parts.push(`waiting ${since(a.since)}`);
  else if (a.state !== 'idle') parts.push(`${since(a.since)} ago`);
  else if (a.since) parts.push(`free for ${since(a.since)}`);
  if (a.llm) parts.push(a.llm.phase === 'reading' ? `reading the brief · ${since(a.llm.started)}` : `writing · ${a.llm.tokens} tokens`);
  let html = parts.map((p) => `<span>${esc(p)}</span>`).join('');
  if (a.progress != null && a.state === 'working') html += `<span>${Math.round(a.progress * 100)}%</span><div class="pbar" style="flex-basis:100%"><i style="width:${(a.progress * 100).toFixed(1)}%"></i></div>`;
  el.querySelector('.sub').innerHTML = html;
}

const logLines = [];
function paintLog() {
  const t = (iso) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(iso));
  $('log').innerHTML = logLines.length
    ? logLines.slice(0, 40).map((l) => `<li class="${l.state}"><time>${t(l.at)}</time><span class="a"><i style="background:${COLOR[l.agent]}"></i>${NAMES[l.agent]}</span><span class="x">${l.job && !String(l.text).includes(`#${l.job}`) ? `#${l.job} · ` : ''}${esc(l.text)}</span></li>`).join('')
    : '<li class="empty" style="display:block">Quiet so far. Lines appear here the moment anyone starts or finishes something.</li>';
}

function paintQueue(qs) {
  if (!qs) return;
  const r = qs.running || [], w = qs.waiting || [];
  $('queue').textContent = r.length ? `Working on ${r.join(', ')}${w.length ? `, then ${w.join(', ')}` : ''}` : w.length ? `Queued: ${w.join(', ')}` : 'Nothing in the work queue';
}

// ---------- wall TV ----------
function paintTv(s) {
  const y = s.ypp, rule = y.rules.now, next = y.rules.from;
  const w = (v, t) => `${Math.max(2, Math.min(100, ((v || 0) / t) * 100)).toFixed(1)}%`;
  const meter = (label, v, t, alt, digits) => `<div class="meter${alt ? ' alt' : ''}"><div class="row"><span>${label}</span><span class="num">${v == null ? '–' : digits ? fmt(v) : Math.round(v).toLocaleString('en-US')} <span class="muted">/ ${fmt(t)}</span></span></div><div class="bar"><i style="width:${w(v, t)}"></i></div></div>`;
  const ch = new Date(next.date);
  const fmtDate = (d) => new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(d));
  let est;
  if (!y.eta.ready) est = `The qualifying date needs a few days of channel totals first (WF5 fetches them every 6 hours). The rules tighten on <b>${fmtDate(ch)}</b>: new channels then need ${fmt(next.shorts)} Shorts views or ${fmt(next.hours)} hours.`;
  else if (y.eta.date) est = `At the last 14 days' pace (${fmt(y.eta.views_per_day)} Shorts views and ${(y.eta.subs_per_day ?? 0).toFixed(1)} subscribers a day) you qualify around <b>${fmtDate(y.eta.date)}</b>${y.eta.rule === 'now' ? `, before the rules change on ${fmtDate(ch)}` : `, under the stricter rules that start on ${fmtDate(ch)}`}.`;
  else est = `At the last 14 days' pace (${fmt(y.eta.views_per_day)} Shorts views and ${(y.eta.subs_per_day ?? 0).toFixed(1)} subscribers a day) the channel doesn't get there within two years. Winners and follow-ups are what moves this.`;
  const src = y.source === 'youtube'
    ? `From YouTube${y.fetched_at ? `, updated ${since(y.fetched_at)} ago` : ''}. Views are near real time; watch hours are long-form only and run 2–3 days behind Studio.`
    : 'Estimated from the tracked videos until WF5 fetches the channel totals.';
  $('tv').innerHTML = `
    <div class="h">Road to monetization (YouTube Partner Program)</div>
    ${meter('Subscribers', y.subs, rule.subs, false, false)}
    ${meter('Shorts views, last 90 days', y.shorts_views_90d, rule.shorts, false, true)}
    <div class="or">or</div>
    ${meter('Long-form watch hours, last 12 months', y.longform_hours_365d, rule.hours, true, false)}
    <div class="est">${est}</div>
    <div class="src">${esc(src)}</div>`;
}

// ---------- whiteboard ----------
function paintBoard(s) {
  const wb = s.whiteboard;
  const when = (iso) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(iso));
  const meta = (n) => n.kind === 'awaiting' ? `<div class="meta hot">${esc(n.format)} · waiting for your OK${n.job ? ` · #${n.job}` : ''}</div>`
    : n.kind === 'booked' ? `<div class="meta">${esc(n.format)} · ${n.at ? esc(when(n.at)) : 'booked'}${n.job ? ` · #${n.job}` : ''}</div>`
    : `<div class="meta">${esc(n.format)} · in the queue</div>`;
  $('notes').innerHTML = wb.notes.length
    ? wb.notes.map((n) => `<div class="note"><b>${esc(n.title)}</b>${meta(n)}<div class="why"><b>Why:</b> ${esc(n.why)}</div></div>`).join('')
    : '<div class="empty">The board is empty: no topics in the queue. Run WF1 (Discover) or queue the launch concepts.</div>';
  const c = wb.counts;
  $('chips').innerHTML = [
    `<span class="chip${c.awaiting ? ' hot' : ''}">${c.awaiting} waiting for your OK in Telegram</span>`,
    `<span class="chip">${c.booked} booked</span>`,
    `<span class="chip">${c.ideas} ideas in the queue</span>`,
    `<span class="chip">${c.datasets} datasets ready</span>`,
  ].join('');
}

function paintClock(s) {
  const n = s.next_upload;
  if (!n || !n.at) { $('next').textContent = '–'; $('nextSub').textContent = ''; return; }
  const d = new Date(n.at);
  $('next').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d).toUpperCase();
  $('nextSub').textContent = n.booked ? `#${n.job} · in ${since(new Date(Date.now() - (d - Date.now())))}` : 'next free slot, nothing booked';
}

// ---------- monitors ----------
function paintPerf(s) {
  const rows = s.performance;
  const cls = (v, ok, strong) => v == null ? '' : v >= strong ? 'up' : v >= ok ? 'mid' : 'dn';
  $('perf').innerHTML = `<div class="h">Video performance</div>` + (rows.length
    ? `<table><thead><tr><th>Video</th><th class="n">Views</th><th class="n">Stayed</th><th class="n">Verdict</th></tr></thead><tbody>${rows.map((r) => `
      <tr><td class="t" title="${esc(r.reason || '')}">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title)}</td>
      <td class="n">${fmt(r.views)}</td><td class="n ${cls(r.stay, 65, 75)}">${pct(r.stay)}</td>
      <td class="n">${r.verdict ? `<span class="vd ${r.verdict}">${r.verdict}${r.win ? ` · ${r.win}` : ''}</span>` : `<span class="vd">${r.win || 'no data yet'}</span>`}</td></tr>`).join('')}</tbody></table>
      <div class="note-s">Stayed = engaged views ÷ views. Verdicts come from the scorecard at 24 h, 72 h and 7 days.</div>`
    : '<div class="empty">No published videos yet. After each upload, send <b>/link &lt;job&gt; &lt;url&gt;</b> in Telegram and the numbers start arriving 24 hours later.</div>');
}

function paintEarn() {
  const lock = '<svg width="26" height="30" viewBox="0 0 26 30"><rect x="2" y="12" width="22" height="16" rx="3" fill="#f0b04a"/><path d="M7 12 v-4 a6 6 0 0 1 12 0 v4" stroke="#56646e" stroke-width="3" fill="none"/></svg>';
  const ghost = [['Per video', 62], ['Per 1,000 views', 34], ['Per month', 80]];
  $('earn').innerHTML = `<div class="h">Earnings</div>
    <div class="lock">${lock}<span>Unlocks when the channel joins the YouTube Partner Program.</span></div>
    <div class="ghost">${ghost.map(([l, w]) => `<div class="hb"><span class="lab">${l}</span><span class="t"><i style="width:${w}%"></i></span><span class="v">€ –</span></div>`).join('')}</div>
    <div class="note-s">After joining, reconnect the Google credential in n8n with the <b>yt-analytics-monetary.readonly</b> permission and this desk fills in by itself.</div>`;
}

function paintLab(s) {
  const e = s.experiments;
  const block = (title, list) => {
    if (!list.length) return '';
    const max = Math.max(...list.map((x) => x.median || 0), 1);
    return `<div class="lab-h">${title}</div>` + list.slice(0, 5).map((x, i) => `<div class="hb"><span class="lab" title="${esc(x.label)}">${esc(x.label)}</span><span class="t"><i class="${i === 0 && list.length > 1 ? 'win' : ''}" style="width:${((x.median || 0) / max * 100).toFixed(1)}%"></i></span><span class="v">${fmt(x.median)} <small>×${x.n}</small></span></div>`).join('');
  };
  const t = e.tests;
  const running = [t.hooks.length > 1 && `hooks (${t.hooks.map((h) => h.toLowerCase().replace(/_/g, ' ')).join(', ')})`, t.lengths.length > 1 && `lengths (${t.lengths.join(', ')} s)`, t.voices.length > 1 && `voices (${t.voices.join(', ')})`, t.formats.length > 1 && `${t.formats.length} formats`].filter(Boolean);
  const body = e.measured
    ? block('Format · median engaged views', e.formats) + block('Hook type', e.hooks) + block('Length', e.lengths) + block('Voice', e.voices)
    : `<div class="empty">No measured videos yet, so no winners. The bars fill in as the 24 h, 72 h and 7 day numbers arrive.</div>`;
  // The Map Reveal opening test: stayed per opening, and whether it can be read yet.
  const o = e.opening;
  const openingBlock = o ? `<div class="lab-h">Map Reveal opening · median stayed at 72 h</div>` + o.arms.map((a, i) => `<div class="hb"><span class="lab">${esc(a.label)}</span><span class="t"><i class="${o.ready && (i === 0) === (o.lead >= 0) ? 'win' : ''}" style="width:${(a.median ?? 0).toFixed(1)}%"></i></span><span class="v">${a.median === null ? '–' : `${Math.round(a.median)}%`} <small>${a.n}/${o.min}</small></span></div>`).join('') + `<div class="note-s">${esc(o.lines.at(-1))}</div>` : '';
  const tune = e.tune.enabled ? (e.tune.updated_at ? `Auto-tune last moved the weights ${since(e.tune.updated_at)} ago.` : 'Auto-tune is on and starts moving weights once 3 videos per option are measured.') : 'Auto-tune is off (/tune on in Telegram).';
  $('lab').innerHTML = `<div class="h">Experiment lab</div>${openingBlock}${body}<div class="note-s">${running.length ? `Testing now: ${esc(running.join(' · '))}. ` : ''}${esc(tune)}</div>`;
}

let state;
function paintState(s) {
  state = s;
  TZ = s.tz?.local || TZ;
  $('chan').textContent = s.channel.name;
  $('domain').textContent = location.host || 'studio';
  paintTv(s); paintBoard(s); paintClock(s); paintPerf(s); paintEarn(s); paintLab(s);
}

// ---------- data ----------
let refetchTimer;
async function loadState() {
  if (DEMO) return paintState(demoState());
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(`${r.status}`);
    paintState(await r.json());
    $('err').style.display = 'none';
  } catch (e) {
    $('err').textContent = `Couldn't load the numbers (${e.message}). Retrying.`;
    $('err').style.display = 'block';
  }
}
const soon = () => { clearTimeout(refetchTimer); refetchTimer = setTimeout(loadState, 1500); };

function setLive(on, text) {
  $('live').className = `live ${on ? 'on' : 'off'}`;
  $('live').querySelector('span').textContent = text;
}

function connect() {
  const es = new EventSource('api/live');
  es.addEventListener('hello', (m) => {
    const d = JSON.parse(m.data);
    d.agents.forEach(paintAgent);
    logLines.splice(0, logLines.length, ...d.log);
    paintLog(); paintQueue(d.queue);
    setLive(true, 'Live');
  });
  es.addEventListener('agent', (m) => paintAgent(JSON.parse(m.data)));
  es.addEventListener('log', (m) => {
    const l = JSON.parse(m.data);
    logLines.unshift(l); logLines.length = Math.min(logLines.length, 80);
    paintLog();
    if (l.state !== 'working') soon();
  });
  es.addEventListener('queue', (m) => paintQueue(JSON.parse(m.data)));
  es.onerror = () => setLive(false, 'Reconnecting…');
  es.onopen = () => setLive(true, 'Live');
}

function tick() {
  $('now').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
  Object.values(agents).forEach(tickAgent);
  Object.values(agents).forEach((a) => office?.agent(a)); // progress and token counts change in place
  if (state) paintClock(state);
}

function demoRun() {
  const now = () => new Date().toISOString();
  const all = CREW.map((c) => ({ id: c.id, state: 'idle', text: 'Free', since: new Date(Date.now() - 40 * 60_000).toISOString() }));
  all.forEach(paintAgent);
  const set = (id, st, text, job, extra = {}) => {
    const a = { ...agents[id], state: st, text, job, since: now(), progress: undefined, llm: undefined, ...extra };
    paintAgent(a);
    if (st !== 'idle') { logLines.unshift({ at: a.since, agent: id, state: st, text, job }); logLines.length = Math.min(logLines.length, 40); paintLog(); }
  };
  set('publisher', 'waiting', '#42 is waiting for your OK in Telegram', 42);
  set('analyst', 'done', '#38 at 7d: 🏆 Winner, 3.1× your median engaged views', 38);
  const job = 43;
  const steps = [
    [0, () => set('scout', 'working', 'Matching 40 trend signals to 112 datasets')],
    [4, () => set('scout', 'done', 'Found 6 new topics in 40 trend signals')],
    [5, () => set('writer', 'working', 'Picked "Which country eats the most rice?" and is loading the data', job)],
    [7, () => set('writer', 'working', 'Writing 9 planned lines', job, { llm: { phase: 'reading', tokens: 0, started: now() } })],
    [11, () => { agents.writer.llm = { phase: 'writing', tokens: 0, started: now() }; }],
    [16, () => set('writer', 'working', 'Fact-checking', job)],
    [19, () => set('writer', 'done', 'Script ready: "The country that eats 9× more rice than you"', job)],
    [20, () => set('narrator', 'working', 'Recording the voice (am_michael)', job)],
    [24, () => { set('narrator', 'done', 'Voice recorded: 9 clips', job); set('editor', 'working', 'Timing the captions from the voice', job); }],
    [27, () => set('editor', 'working', 'Starting the video renderer', job, { progress: 0 })],
    [37, () => set('editor', 'working', 'Mixing voice, music and sound effects', job)],
    [39, () => { set('editor', 'done', 'Rendered 31.4 s of video', job); set('checker', 'working', 'Checking format, loudness, dead air, numbers and speech', job); }],
    [43, () => set('checker', 'done', 'All checks passed', job)],
    [44, () => set('publisher', 'waiting', `#${job} is waiting for your OK in Telegram`, job)],
    [50, () => set('analyst', 'working', 'Reading the 72h numbers for #40', 40)],
    [54, () => set('analyst', 'done', '#40 at 72h: 🙂 Average, nothing failing, but below target in places', 40)],
  ];
  let t0;
  setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    if (agents.writer?.llm?.phase === 'writing') agents.writer.llm.tokens += 9;
    if (agents.editor?.state === 'working' && agents.editor.progress != null) agents.editor.progress = Math.min(1, (s - 27) / 10);
  }, 250);
  const cycle = () => {
    t0 = Date.now();
    steps.forEach(([at, fn]) => setTimeout(fn, at * 1000));
    setTimeout(() => { ['scout', 'writer', 'narrator', 'editor', 'checker'].forEach((id) => set(id, 'idle', 'Free')); cycle(); }, 70_000);
  };
  cycle();
  paintQueue({ running: ['produce'], waiting: [] });
  setLive(true, 'Demo');
}

buildCrew();
paintLog();
loadState();
setInterval(tick, 1000);
tick();
if (DEMO) { $('demoTag').hidden = false; demoRun(); }
else { connect(); setInterval(loadState, 60_000); }
</script>
